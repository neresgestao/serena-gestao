  --ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  min-height: 100vh;
  background:
    radial-gradient(1200px 620px at 18% -8%, rgba(176,141,87,0.10), transparent 62%),
    linear-gradient(163deg, ${b.umber} 0%, ${b.slate} 46%, ${b.graphite} 78%, ${b.ink} 100%);
  background-attachment: fixed;
  color: ${b.bone};
  font-family: var(--ui);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
.sr-app *, .sr-backdrop * { box-sizing: border-box; }
.sr-app ::selection { background: ${b.brass}; color: ${b.ink}; }

/* \u2500\u2500 cabe\xE7alho \u2500\u2500 */
.sr-top {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 32px;
  padding: 0 34px; height: 74px;
  border-bottom: 1px solid ${b.line};
  background: rgba(21,23,26,0.72);
  backdrop-filter: blur(18px) saturate(140%);
}
.sr-brand { display: flex; align-items: center; gap: 16px; }
.sr-word { font: 300 20px/1 var(--display); letter-spacing: .36em; text-transform: uppercase; color: ${b.bone}; padding-left: .36em; }
.sr-nav { display: flex; gap: 2px; margin-left: 10px; }
.sr-navi {
  background: none; border: 0; cursor: pointer;
  font: 500 11px/1 var(--ui); letter-spacing: .13em; text-transform: uppercase;
  color: ${b.boneFaint}; padding: 11px 15px; border-radius: 2px;
  transition: color .22s ease, background .22s ease; position: relative;
}
.sr-navi:hover { color: ${b.bone}; background: rgba(237,234,227,0.04); }
.sr-navi.on { color: ${b.brassLit}; }
.sr-navi.on::after {
  content: ''; position: absolute; left: 15px; right: 15px; bottom: 2px;
  height: 1px; background: ${b.brass};
}
.sr-right { margin-left: auto; }
.sr-data { display: flex; align-items: center; gap: 16px; font: 400 11px/1 var(--ui); color: ${b.boneFaint}; text-transform: capitalize; }
.sr-reset {
  background: none; border: 1px solid ${b.line2}; color: ${b.boneFaint}; cursor: pointer;
  font: 500 9.5px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase;
  padding: 7px 10px; border-radius: 2px; transition: all .2s ease;
}
.sr-reset:hover { color: ${b.bone}; border-color: ${b.brass}; }
.sr-login { display: flex; align-items: center; justify-content: center; padding: 24px; }
.sr-login-card {
  width: 100%; max-width: 400px; padding: 44px 40px;
  background: linear-gradient(168deg, rgba(237,234,227,0.05), rgba(237,234,227,0.02));
  border: 1px solid ${b.line2}; border-radius: 6px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
}
.sr-login-brand { display: flex; align-items: center; gap: 14px; justify-content: center; }
.sr-login-sub { text-align: center; font: 400 11px/1.5 var(--ui); letter-spacing: .05em; color: ${b.boneFaint}; margin-top: 16px; }
.sr-login-rodape { text-align: center; font: 400 10px/1.5 var(--ui); color: ${b.boneFaint}; margin-top: 22px; }
.sr-nuvem { display: inline-flex; align-items: center; gap: 6px; font: 500 9.5px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; color: ${b.boneDim}; }
.sr-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; box-shadow: 0 0 6px currentColor; }
.sr-aviso {
  margin: 12px 34px 0; padding: 10px 14px; border-left: 2px solid ${b.amber};
  background: rgba(201,154,78,0.08); font: 400 12px var(--ui); color: ${b.amber}; border-radius: 2px;
}

/* \u2500\u2500 corpo \u2500\u2500 */
.sr-main { padding: 34px 34px 20px; max-width: 1560px; margin: 0 auto; }
.sr-titulo { margin-bottom: 26px; }
.sr-titulo h1 { font: 300 34px/1.1 var(--display); color: ${b.bone}; margin: 0; letter-spacing: .015em; }
.sr-titulo p { font: 400 12.5px/1 var(--ui); color: ${b.boneFaint}; margin: 9px 0 0; }
.sr-load { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 110px 0; color: ${b.boneFaint}; font: 400 12px var(--ui); animation: pulso 2.4s ease-in-out infinite; }
@keyframes pulso { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
.sr-foot {
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: 22px 34px 34px; max-width: 1560px; margin: 0 auto;
  border-top: 1px solid ${b.line}; margin-top: 26px;
  font: 400 10.5px/1.5 var(--ui); color: ${b.boneFaint};
}

/* \u2500\u2500 cart\xF5es e grades \u2500\u2500 */
.sr-card {
  background: linear-gradient(180deg, rgba(237,234,227,0.045), rgba(237,234,227,0.018));
  border: 1px solid ${b.line}; border-radius: 4px;
  box-shadow: 0 1px 0 rgba(237,234,227,0.05) inset, 0 12px 34px rgba(0,0,0,0.22);
}
.sr-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.sr-grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
.sr-grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
@media (max-width: 1200px) { .sr-grid-6 { grid-template-columns: repeat(3, 1fr); } }
.sr-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.sr-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.sr-split { display: grid; grid-template-columns: 1.62fr 1fr; gap: 14px; }

/* \u2500\u2500 barra de ferramentas \u2500\u2500 */
.sr-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.sr-tabs { display: flex; border: 1px solid ${b.line}; border-radius: 3px; overflow: hidden; }
.sr-tab {
  background: none; border: 0; cursor: pointer; padding: 9px 15px;
  font: 500 10.5px/1 var(--ui); letter-spacing: .09em; text-transform: uppercase;
  color: ${b.boneFaint}; transition: all .2s ease; border-right: 1px solid ${b.line};
}
.sr-tab:last-child { border-right: 0; }
.sr-tab:hover { color: ${b.bone}; background: rgba(237,234,227,0.04); }
.sr-tab.on { color: ${b.ink}; background: ${b.brass}; }
.sr-check { display: inline-flex; align-items: center; gap: 8px; font: 400 11.5px var(--ui); color: ${b.boneDim}; cursor: pointer; padding: 8px 14px; border: 1px solid ${b.line}; border-radius: 3px; transition: border-color .15s ease, color .15s ease; }
.sr-check:hover { color: ${b.bone}; }
.sr-check input { accent-color: ${b.brass}; width: 14px; height: 14px; cursor: pointer; }

/* \u2500\u2500 controles \u2500\u2500 */
.sr-in {
  width: 100%; background: rgba(21,23,26,0.55); border: 1px solid ${b.line2};
  border-radius: 3px; padding: 9px 11px; color: ${b.bone};
  font: 400 12.5px var(--ui); outline: none; transition: border-color .2s ease, box-shadow .2s ease;
}
.sr-in::placeholder { color: ${b.boneFaint}; }
.sr-in:focus-visible { border-color: ${b.brass}; box-shadow: 0 0 0 2px ${b.brassDim}; }
.sr-in:read-only { color: ${b.boneDim}; background: rgba(21,23,26,0.28); }
select.sr-in { cursor: pointer; appearance: none; padding-right: 26px;
  background-image: linear-gradient(45deg, transparent 50%, ${b.boneFaint} 50%), linear-gradient(135deg, ${b.boneFaint} 50%, transparent 50%);
  background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
select.sr-in option, select.sr-in optgroup { background: ${b.graphite}; color: ${b.bone}; }
input[type="date"].sr-in::-webkit-calendar-picker-indicator { filter: invert(.62) sepia(.4) saturate(2); cursor: pointer; }

.sr-btn {
  background: none; border: 1px solid ${b.line2}; color: ${b.boneDim}; cursor: pointer;
  font: 500 10px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase;
  padding: 9px 13px; border-radius: 2px; transition: all .2s ease; white-space: nowrap;
}
.sr-btn:hover:not(:disabled) { color: ${b.bone}; border-color: ${b.bone}; }
.sr-btn:disabled { opacity: .34; cursor: not-allowed; }
.sr-btn-brass { background: ${b.brass}; border-color: ${b.brass}; color: ${b.ink}; }
.sr-btn-brass:hover:not(:disabled) { background: ${b.brassLit}; border-color: ${b.brassLit}; color: ${b.ink}; }
.sr-btn-perigo { border-color: ${b.rust}; color: ${b.rust}; margin-right: auto; }
.sr-btn-perigo:hover:not(:disabled) { background: ${b.rust}; border-color: ${b.rust}; color: ${b.bone}; }
.sr-chip {
  background: none; border: 1px solid ${b.line2}; color: ${b.boneFaint}; cursor: pointer;
  font: 400 10px/1 var(--ui); padding: 6px 9px; border-radius: 2px; margin-right: 6px; transition: all .2s ease;
}
.sr-chip:hover { color: ${b.brassLit}; border-color: ${b.brass}; }
.sr-x { background: none; border: 0; color: ${b.boneFaint}; font-size: 24px; line-height: 1; cursor: pointer; padding: 0 4px; transition: color .2s ease; }
.sr-x:hover { color: ${b.bone}; }
.sr-app :focus-visible, .sr-modal :focus-visible { outline: 1px solid ${b.brass}; outline-offset: 2px; }

/* \u2500\u2500 tabelas \u2500\u2500 */
.sr-tw { overflow-x: auto; }
.sr-table { width: 100%; border-collapse: collapse; font: 400 12px var(--ui); }
/* Sem position:sticky aqui. O .sr-tw rola na horizontal, ent\xE3o vira o contexto do
   sticky \u2014 e o cabe\xE7alho ia parar 74px abaixo do topo da tabela, em cima das linhas. */
.sr-table th {
  text-align: left; padding: 13px 12px; font: 500 9.5px/1 var(--ui);
  letter-spacing: .13em; text-transform: uppercase; color: ${b.boneFaint};
  border-bottom: 1px solid ${b.line2}; white-space: nowrap; background: rgba(21,23,26,0.30);
}
.sr-table td { padding: 12px; border-bottom: 1px solid ${b.line}; color: ${b.boneDim}; vertical-align: middle; }
.sr-table tbody tr { transition: background .16s ease; }
.sr-table tbody tr:hover { background: rgba(237,234,227,0.035); }
.sr-table tbody tr:last-child td { border-bottom: 0; }
.sr-table .mono { font-family: var(--mono); font-size: 11px; }
.sr-table .num { text-align: right; color: ${b.bone}; }
.sr-trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 260px; }

/* \u2500\u2500 modal \u2500\u2500 */
.sr-backdrop {
  position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center;
  padding: 24px; background: rgba(10,11,13,0.72); backdrop-filter: blur(6px);
  animation: fade .18s ease; font-family: var(--ui);
}
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
.sr-modal {
  width: 100%; max-height: 88vh; display: flex; flex-direction: column;
  background: linear-gradient(168deg, ${b.slate}, ${b.graphite} 70%);
  border: 1px solid ${b.line2}; border-radius: 5px;
  box-shadow: 0 32px 90px rgba(0,0,0,0.6); animation: sobe .22s cubic-bezier(.2,.7,.3,1);
  color: ${b.bone};
}
@keyframes sobe { from { opacity: 0; transform: translateY(10px) scale(.99) } to { opacity: 1; transform: none } }
.sr-form { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.sr-acoes { display: flex; justify-content: flex-end; gap: 8px; margin-top: 26px; padding-top: 18px; border-top: 1px solid ${b.line}; }
.sr-resumo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 16px; border: 1px solid ${b.line}; border-radius: 3px; background: rgba(21,23,26,0.34); }
.sr-resumo .v { font: 400 17px/1 var(--ui); color: ${b.bone}; margin-top: 9px; font-variant-numeric: tabular-nums; }
.sr-nota { padding: 11px 14px; background: rgba(237,234,227,0.035); border-radius: 2px; font: 400 12px/1.6 var(--ui); color: ${b.boneDim}; }
.sr-linha { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid ${b.line}; font: 400 12px var(--ui); }
.sr-linha:last-child { border-bottom: 0; }
.sr-linha .mono { font-family: var(--mono); font-size: 11px; }

/* \u2500\u2500 alertas e fluxo \u2500\u2500 */
.sr-acoes-linha { display: inline-flex; gap: 5px; align-items: center; }
.sr-anexo-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 3px; padding: 8px 10px;
  background: transparent; border: 1px solid ${b.line2}; border-radius: 2px; cursor: pointer;
  transition: border-color .15s ease, background .15s ease; white-space: nowrap; vertical-align: middle;
  height: 30px; box-sizing: border-box;
}
.sr-anexo-btn:hover { border-color: ${b.brass}; background: rgba(176,141,87,0.08); }
.sr-drop {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 22px; border: 1px dashed ${b.line2}; border-radius: 4px; cursor: pointer;
  background: rgba(237,234,227,0.02); color: ${b.boneDim}; font: 400 12.5px var(--ui);
  transition: border-color .15s ease, background .15s ease;
}
.sr-drop:hover:not(:disabled) { border-color: ${b.brass}; background: rgba(176,141,87,0.05); color: ${b.bone}; }
.sr-drop:disabled { cursor: default; }
.sr-prog { height: 5px; background: ${b.line}; border-radius: 3px; overflow: hidden; }
.sr-prog-fill { height: 100%; background: ${b.brass}; transition: width .2s ease; }
.sr-anexo-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border: 1px solid ${b.line}; border-radius: 3px; margin-bottom: 8px;
}
.sr-pick {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-bottom: 1px solid ${b.line}; font: 400 12px var(--ui); cursor: pointer;
  transition: background .15s ease, opacity .15s ease;
}
.sr-pick:last-child { border-bottom: 0; }
.sr-pick:hover { background: rgba(237,234,227,0.04); }
.sr-pick input { accent-color: ${b.brass}; width: 14px; height: 14px; cursor: pointer; flex: none; }
.sr-pick .mono { font-family: var(--mono); font-size: 11px; }
.sr-alertas { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; max-height: 236px; overflow-y: auto; padding-right: 4px; }
.sr-alertas::-webkit-scrollbar { width: 4px; }
.sr-alertas::-webkit-scrollbar-thumb { background: ${b.line2}; border-radius: 2px; }
.sr-alerta {
  display: block; width: 100%; text-align: left; cursor: pointer;
  background: rgba(237,234,227,0.03); border: 0; border-radius: 2px;
  padding: 11px 13px; transition: background .2s ease;
}
.sr-alerta:hover { background: rgba(237,234,227,0.07); }
.sr-dia { border-bottom: 1px solid ${b.line}; }
.sr-dia:last-child { border-bottom: 0; }
.sr-dia-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 20px; background: rgba(21,23,26,0.28); }
.sr-ev { display: flex; align-items: center; gap: 12px; padding: 11px 20px; border-top: 1px solid ${b.line}; }
.sr-ev:hover { background: rgba(237,234,227,0.028); }
.sr-ev .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* \u2500\u2500 responsivo \u2500\u2500 */
@media (max-width: 1180px) {
  .sr-split { grid-template-columns: 1fr; }
  .sr-grid-4 { grid-template-columns: repeat(2, 1fr); }
  .sr-grid-2 { grid-template-columns: 1fr; }
}
@media (max-width: 860px) {
  .sr-top { height: auto; flex-wrap: wrap; gap: 12px; padding: 14px 18px; position: static; }
  .sr-nav { margin-left: 0; width: 100%; overflow-x: auto; }
  .sr-right { margin-left: 0; }
  .sr-main { padding: 22px 18px; }
  .sr-foot { padding: 20px 18px 28px; }
  .sr-grid-4, .sr-grid-3 { grid-template-columns: 1fr; }
  .sr-form { grid-template-columns: 1fr 1fr; }
  .sr-form label[style*="span 3"] { grid-column: span 2 !important; }
  .sr-resumo { grid-template-columns: 1fr; }
  .sr-titulo h1 { font-size: 27px; }
}

/* \u2500\u2500 movimento reduzido \u2500\u2500 */
@media (prefers-reduced-motion: reduce) {
  .sr-app *, .sr-backdrop * { animation: none !important; transition: none !important; }
}

/* \u2500\u2500 impress\xE3o \u2500\u2500 */
@media print {
  .sr-app { background: #fff !important; color: #111 !important; }
  .sr-top, .sr-foot, .sr-toolbar, .sr-btn, .sr-chip, .sr-reset, .sr-acoes-linha { display: inline-flex; gap: 5px; }
.sr-pick {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-bottom: 1px solid ${b.line}; font: 400 12px var(--ui); cursor: pointer;
  transition: background .15s ease, opacity .15s ease;
}
.sr-pick:last-child { border-bottom: 0; }
.sr-pick:hover { background: rgba(237,234,227,0.04); }
.sr-pick input { accent-color: ${b.brass}; width: 14px; height: 14px; cursor: pointer; flex: none; }
.sr-pick .mono { font-family: var(--mono); font-size: 11px; }
.sr-alertas { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; max-height: 236px; overflow-y: auto; padding-right: 4px; }
.sr-alertas::-webkit-scrollbar { width: 4px; }
.sr-alertas::-webkit-scrollbar-thumb { background: ${b.line2}; border-radius: 2px; }
.sr-alerta { display: none !important; }
  .sr-card { border: 1px solid #ccc !important; box-shadow: none !important; background: #fff !important; break-inside: avoid; }
  .sr-table th, .sr-table td { color: #111 !important; border-color: #ddd !important; }
  .sr-titulo h1 { color: #111 !important; }
  .sr-main { padding: 0 !important; }
}
