.sr-app {
  --display: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

.sr-app *, .sr-backdrop * { box-sizing: border-box; }

  border-bottom: 1px solid ${b.line};
  background: rgba(21,23,26,0.72);
  backdrop-filter: blur(18px) saturate(140%);
}
.sr-brand { display: flex; align-items: center; gap: 16px; }
.sr-word { font: 300 20px/1 var(--display); letter-spacing: .36em; text-transform: uppercase; color: ${b.bone}; padding-left: .36em; }
.sr-nav { display: flex; gap: 2px; margin-left: 10px; }
.sr-navi {
  background: none; border: 0; cursor: pointer;
  font: 500 11px/1 var(--ui); letter-spacing: .13em; text-transform: uppercase;
  color: ${b.boneFaint}; padding: 11px 15px; border-radius: 2px;
  transition: color .22s ease, background .22s ease; position: relative;
}
.sr-navi:hover { color: ${b.bone}; background: rgba(237,234,227,0.04); }
