@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap');

.sr-app {
  --display: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  min-height: 100vh;
  background:
    radial-gradient(1200px 620px at 18% -8%, rgba(176,141,87,0.10), transparent 62%),
    linear-gradient(163deg, ${E.umber} 0%, ${E.slate} 46%, ${E.graphite} 78%, ${E.ink} 100%);
  background-attachment: fixed;
  color: ${E.bone};
  font-family: var(--ui);
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
}
.sr-app *, .sr-backdrop * { box-sizing: border-box; }
.sr-app ::selection { background: ${E.brass}; color: ${E.ink}; }

/* \u2500\u2500 cabe\xE7alho \u2500\u2500 */
.sr-top {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 32px;
  padding: 0 34px; height: 74px;
  border-bottom: 1px solid ${E.line};
  background: rgba(21,23,26,0.72);
  backdrop-filter: blur(18px) saturate(140%);
}
.sr-brand { display: flex; align-items: center; gap: 16px; }
.sr-word { font: 300 20px/1 var(--display); letter-spacing: .36em; text-transform: uppercase; color: ${E.bone}; padding-left: .36em; }
.sr-nav { display: flex; gap: 2px; margin-left: 10px; }
.sr-navi {
  background: none; border: 0; cursor: pointer;
  font: 500 11px/1 var(--ui); letter-spacing: .13em; text-transform: uppercase;
  color: ${E.boneFaint}; padding: 11px 15px; border-radius: 2px;
  transition: color .22s ease, background .22s ease; position: relative;
}
.sr-navi:hover { color: ${E.bone}; background: rgba(237,234,227,0.04); }
.sr-navi.on { color: ${E.brassLit}; }
.sr-navi.on::after {
  content: ''; position: absolute; left: 15px; right: 15px; bottom: 2px;
  height: 1px; background: ${E.brass};
}
.sr-right { margin-left: auto; }
.sr-data { display: flex; align-items: center; gap: 16px; font: 400 11px/1 var(--ui); color: ${E.boneFaint}; text-transform: capitalize; }
.sr-reset {
  background: none; border: 1px solid ${E.line2}; color: ${E.boneFaint}; cursor: pointer;
  font: 500 9.5px/1 var(--ui); letter-spacing: .12em; text-transform: uppercase;
  padding: 7px 10px; border-radius: 2px; transition: all .2s ease;
}
.sr-reset:hover { color: ${E.bone}; border-color: ${E.brass}; }
.sr-login { display: flex; align-items: center; justify-content: center; padding: 24px; }
.sr-login-card {
  width: 100%; max-width: 400px; padding: 44px 40px;
  background: linear-gradient(168deg, rgba(237,234,227,0.05), rgba(237,234,227,0.02));
  border: 1px solid ${E.line2}; border-radius: 6px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
}
.sr-login-brand { display: flex; align-items: center; gap: 14px; justify-content: center; }
.sr-login-sub { text-align: center; font: 400 11px/1.5 var(--ui); letter-spacing: .05em; color: ${E.boneFaint}; margin-top: 16px; }
.sr-login-rodape { text-align: center; font: 400 10px/1.5 var(--ui); color: ${E.boneFaint}; margin-top: 22px; }
.sr-nuvem { display: inline-flex; align-items: center; gap: 6px; font: 500 9.5px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; color: ${E.boneDim}; }
.sr-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; box-shadow: 0 0 6px currentColor; }
.sr-aviso {
  margin: 12px 34px 0; padding: 10px 14px; border-left: 2px solid ${E.amber};
  background: rgba(201,154,78,0.08); font: 400 12px var(--ui); color: ${E.amber}; border-radius: 2px;
}

/* \u2500\u2500 corpo \u2500\u2500 */
.sr-main { padding: 34px 34px 20px; max-width: 1560px; margin: 0 auto; }
.sr-titulo { margin-bottom: 26px; }
.sr-titulo h1 { font: 300 34px/1.1 var(--display); color: ${E.bone}; margin: 0; letter-spacing: .015em; }
.sr-titulo p { font: 400 12.5px/1 var(--ui); color: ${E.boneFaint}; margin: 9px 0 0; }
.sr-load { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 110px 0; color: ${E.boneFaint}; font: 400 12px var(--ui); animation: pulso 2.4s ease-in-out infinite; }
@keyframes pulso { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
.sr-foot {
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: 22px 34px 34px; max-width: 1560px; margin: 0 auto;
  border-top: 1px solid ${E.line}; margin-top: 26px;
  font: 400 10.5px/1.5 var(--ui); color: ${E.boneFaint};
}

/* \u2500\u2500 cart\xF5es e grades \u2500\u2500 */
.sr-card {
  background: linear-gradient(180deg, rgba(237,234,227,0.045), rgba(237,234,227,0.018));
  border: 1px solid ${E.line}; border-radius: 4px;
  box-shadow: 0 1px 0 rgba(237,234,227,0.05) inset, 0 12px 34px rgba(0,0,0,0.22);
}
.sr-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.sr-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.sr-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.sr-split { display: grid; grid-template-columns: 1.62fr 1fr; gap: 14px; }

/* \u2500\u2500 barra de ferramentas \u2500\u2500 */
.sr-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.sr-tabs { display: flex; border: 1px solid ${E.line}; border-radius: 3px; overflow: hidden; }
.sr-tab {
  background: none; border: 0; cursor: pointer; padding: 9px 15px;
  font: 500 10.5px/1 var(--ui); letter-spacing: .09em; text-transform: uppercase;
  color: ${E.boneFaint}; transition: all .2s ease; border-right: 1px solid ${E.line};
}
.sr-tab:last-child { border-right: 0; }
.sr-tab:hover { color: ${E.bone}; background: rgba(237,234,227,0.04); }
.sr-tab.on { color: ${E.ink}; background: ${E.brass}; }
.sr-check { display: inline-flex; align-items: center; gap: 8px; font: 400 11.5px var(--ui); color: ${E.boneDim}; cursor: pointer; padding: 8px 14px; border: 1px solid ${E.line}; border-radius: 3px; transition: border-color .15s ease, color .15s ease; }
.sr-check:hover { color: ${E.bone}; }
.sr-check input { accent-color: ${E.brass}; width: 14px; height: 14px; cursor: pointer; }

/* \u2500\u2500 controles \u2500\u2500 */
.sr-in {
  width: 100%; background: rgba(21,23,26,0.55); border: 1px solid ${E.line2};
  border-radius: 3px; padding: 9px 11px; color: ${E.bone};
  font: 400 12.5px var(--ui); outline: none; transition: border-color .2s ease, box-shadow .2s ease;
}
.sr-in::placeholder { color: ${E.boneFaint}; }
.sr-in:focus-visible { border-color: ${E.brass}; box-shadow: 0 0 0 2px ${E.brassDim}; }
.sr-in:read-only { color: ${E.boneDim}; background: rgba(21,23,26,0.28); }
select.sr-in { cursor: pointer; appearance: none; padding-right: 26px;
  background-image: linear-gradient(45deg, transparent 50%, ${E.boneFaint} 50%), linear-gradient(135deg, ${E.boneFaint} 50%, transparent 50%);
